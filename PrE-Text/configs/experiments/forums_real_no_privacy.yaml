inherits:
  - ../base/paths.yaml
  - ../base/models.yaml
  - ../base/runtime.yaml

meta:
  experiment_id: forums_real_no_privacy
  seed: 42

paths:
  dataset_root: ../thesis_platform/datasets
  model_root: ../thesis_platform/open_model

data:
  dataset_name: forums
  train_path: ../thesis_platform/datasets/pretext_forums/formatted/forums_train.json
  eval_path: ../thesis_platform/datasets/pretext_forums/formatted/forums_eval.json
  initialization_path: ../thesis_platform/datasets/pretext_initialization_c4_en/formatted/initialization.json
  max_samples_per_client: 16
  initialization_min_words: 20

stage1:
  sensitivity: 8
  privacy_disabled: true

bootstrap:
  num_prompts: 10000

eval_small:
  enabled: false

eval_large:
  enabled: false
