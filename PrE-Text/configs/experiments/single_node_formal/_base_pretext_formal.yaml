inherits:
  - ../../base/paths.yaml
  - ../../base/models.yaml
  - ../../base/runtime.yaml
  - ../../templates/noise_eps129.yaml

meta:
  stage: single_node_formal
  seed: 42

runtime:
  device: cuda

paths:
  dataset_root: ../thesis_platform/datasets
  model_root: ../thesis_platform/open_model

bootstrap:
  generator_model: llama2_7b
  generator_backend: vllm
  num_prompts: 1500
  max_model_len: 512
  gpu_memory_utilization: 0.35
  enforce_eager: true
  startup_required_free_gb: 2
  tensor_parallel_size: 1
  device: cuda

eval_small:
  enabled: false
  eval_mode: gpt2

eval_large:
  enabled: false
