inherits:
  - ../base/paths.yaml
  - ../base/models.yaml
  - ../base/runtime.yaml
  - ../templates/noise_eps758.yaml

meta:
  experiment_id: validate_tiny
  seed: 42

paths:
  dataset_root: ../thesis_platform/datasets
  model_root: ../thesis_platform/open_model

data:
  dataset_name: jobs
  train_path: ../thesis_platform/datasets/pretext_jobs/formatted/jobs_train.json
  eval_path: ../thesis_platform/datasets/pretext_jobs/formatted/jobs_eval.json
  initialization_path: ../thesis_platform/datasets/pretext_initialization_c4_en/formatted/initialization.json
  max_samples_per_client: 4
  initialization_min_words: 20
  train_limit: 32
  eval_limit: 16
  initialization_limit: 256

stage1:
  rounds: 2
  lookahead: 1
  multiplier: 1
  batch_size: 16
  embed_batch_size: 32
  nearest_neighbors_print: 1
  sensitivity: 8
  num_workers: 0

bootstrap:
  enabled: false

eval_small:
  enabled: false

eval_large:
  enabled: false
