inherits:
  - ../base/paths.yaml
  - ../base/models.yaml
  - ../base/runtime.yaml
  - ../templates/noise_eps758.yaml

meta:
  experiment_id: validate_tiny_complete_test_windows
  seed: 42

paths:
  dataset_root: ../thesis_platform/datasets
  model_root: ../thesis_platform/open_model

data:
  dataset_name: jobs
  train_path: ../thesis_platform/datasets/pretext_jobs/formatted/jobs_train.json
  eval_path: ../thesis_platform/datasets/pretext_jobs/formatted/jobs_eval.json
  initialization_path: ../thesis_platform/datasets/pretext_initialization_c4_en/formatted/initialization.json
  max_samples_per_client: 4
  initialization_min_words: 20
  train_limit: 32
  eval_limit: 16
  initialization_limit: 256

stage1:
  rounds: 2
  lookahead: 1
  multiplier: 1
  batch_size: 16
  embed_batch_size: 32
  nearest_neighbors_print: 1
  sensitivity: 8
  num_workers: 0  # Windows fix: disable multiprocessing

bootstrap:
  enabled: true
  num_prompts: 16  # Very small for quick test
  generator_backend: huggingface  # Use HuggingFace on Windows (vLLM not available)
  generator_model: llama_3_2_3b_instruct  # Use smaller 3B model for Windows compatibility
  batch_size: 1  # Small batch size to avoid OOM
  device: cuda  # Use GPU for 3B model
  max_tokens: 64
  temperature: 1.0
  top_p: 1.0
  max_model_len: 512

eval_small:
  enabled: true
  eval_mode: gpt2  # gpt2: HuggingFace base GPT-2 | distilgpt2: requires c4_checkpoint.pth
  cutoff_len: 64
  grad_accum_steps: 16
  epochs: 3
  batch_size: 16
  eval_batch_size: 8
  learning_rate: 0.0002

# eval_large model options:
#   - gpt2_xl: GPT-2 XL (1.5B) full fine-tuning - Windows compatible, single-file model
#   - full_finetune: Llama-3.2-3B full fine-tuning - may segfault on Windows (sharded safetensors)
#   - peft_lora: LLaMA-2-7B + PEFT LoRA - Linux recommended
eval_large:
  enabled: true
  eval_mode: gpt2_xl
  cutoff_len: 64
  grad_accum_steps: 32
  epochs: 3
  batch_size: 1
  eval_batch_size: 1
  learning_rate: 0.0002