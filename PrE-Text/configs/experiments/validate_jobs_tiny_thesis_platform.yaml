inherits:
  - ../base/paths.yaml
  - ../base/models.yaml
  - ../base/runtime.yaml
  - ../templates/noise_eps758.yaml

meta:
  experiment_id: validate_jobs_tiny_thesis_platform_eps758
  seed: 42

paths:
  dataset_root: ../thesis_platform/datasets
  model_root: ../thesis_platform/open_model

data:
  dataset_name: jobs
  train_path: ../thesis_platform/datasets/pretext_jobs/formatted/jobs_train.json
  eval_path: ../thesis_platform/datasets/pretext_jobs/formatted/jobs_eval.json
  initialization_path: ../thesis_platform/datasets/pretext_initialization_c4_en/formatted/initialization.json
  max_samples_per_client: 8
  initialization_min_words: 20
  train_limit: 64
  eval_limit: 32
  initialization_limit: 512

stage1:
  rounds: 2
  lookahead: 1
  multiplier: 1
  batch_size: 32
  embed_batch_size: 64
  nearest_neighbors_print: 1
  sensitivity: 8
  num_workers: 0

bootstrap:
  enabled: true
  num_prompts: 32
  generator_backend: huggingface
  generator_model: llama2_7b
  batch_size: 1
  max_tokens: 85
  temperature: 1.0
  top_p: 1.0
  max_model_len: 512

eval_small:
  enabled: false

eval_large:
  enabled: false
  eval_mode: peft_lora
  batch_size: 1
  eval_batch_size: 1
  cutoff_len: 64
  grad_accum_steps: 16
  learning_rate: 0.0002
  lora_rank: 4
