inherits:
  - ../../base/paths.yaml
  - ../../base/models.yaml
  - ../../base/runtime.yaml
  - ../../templates/noise_eps129.yaml

execution:
  mode: federated_pretext

meta:
  stage: federated_formal
  seed: 42

runtime:
  device: cuda

paths:
  dataset_root: ../thesis_platform/datasets
  model_root: ../thesis_platform/open_model

federation:
  rounds: 10
  num_clients: 16
  max_samples_per_client: 16
  validation_ratio: 0.25
  partition_strategy: preserve_buckets

data:
  max_samples_per_client: 16
  initialization_min_words: 20

stage1:
  sensitivity: 8
  batch_size: 64
  embed_batch_size: 128

bootstrap:
  enabled: true
  generator_model: llama2_7b
  generator_backend: vllm
  num_prompts: 1500
  max_model_len: 512
  gpu_memory_utilization: 0.55
  enforce_eager: true
  startup_required_free_gb: 2
  tensor_parallel_size: 1
  device: cuda

eval_small:
  enabled: false
  eval_mode: gpt2

eval_large:
  enabled: false

eval_glue:
  enabled: false
