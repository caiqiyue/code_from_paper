inherits:
  - ../../base/paths.yaml
  - ../../base/runtime.yaml
  - ../../base/models.yaml
  - ../../templates/noise_eps129.yaml

meta:
  stage: single_node_formal
  seed: 42

pipeline:
  stage1_mode: selector_seed_search
  stage2_mode: pretext_bootstrap
  run_eval: true

generator:
  backend: thesis_pretext_prompt
  source: thesis_platform/adapters/generators/pretext_prompt_generator.py
  initial_prompt: "Generate realistic texts that match the target dataset style and task domain."
  candidate_count: 100
  generated_per_round: 16
  exemplars_per_prompt: 2
  max_new_tokens: 192
  max_rounds: 12
  max_prompt_chars: 512
  max_exemplar_chars: 256

selector:
  top_q: 4
  rank_weights: [1.0, 0.6, 0.3, 0.15]
  seed_top_k: 10
  hard_negative_top_k: 10
  private_knn_k: 8
  reference_top_k: 6
  reference_rank_weights: [1.0, 0.8, 0.6, 0.4, 0.25, 0.1]
  density_lambda: 0.50
  novelty_lambda: 0.30
  length_lambda: 0.20
  length_floor: 12
  length_ceiling: 128
  lambda_generic: 0.35
  lambda_redundancy: 0.25

bootstrap:
  num_prompts: 1500
  generator_backend: vllm
  generator_model: llama2_7b
  batch_size: 1
  max_tokens: 85
  temperature: 1.0
  top_p: 1.0
  max_model_len: 512
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.35
  startup_required_free_gb: 2
  enforce_eager: true
  device: cuda

eval:
  enabled: true
  mode: pretext_small
  small_eval_mode: gpt2
  device: cuda
  max_samples_per_client: 16
  initialization_min_words: 20
  small_epochs: 20
  small_batch_size: 8
  small_eval_batch_size: 2
  small_grad_accum_steps: 8
  small_cutoff_len: 64
  small_learning_rate: 0.0002
  small_num_proc: 1
