model:
  default_family: lightgbm
  feature_version: no_dataset
  include_dataset_one_hot: false
  onehot_order: [jobs, congressional, forums, microblog, imdb, openreview]
  delta_actions: [-2, -1, 0, 1, 2]
  feature_fields:
    - shape_score
    - private_mean_length
    - private_p75_length
    - private_length_iqr
    - support_mean_at_k20
    - coverage_mean_at_k20
    - coverage_p25_at_k20
    - genericity_mean_at_k20
    - redundancy_mean_at_k20
  family_params:
    lightgbm:
      objective: regression
      metric: l2
      n_estimators: 120
      learning_rate: 0.03
      num_leaves: 15
      max_depth: 4
      min_child_samples: 8
      reg_alpha: 0.1
      reg_lambda: 0.2
      verbose: -1
      random_state: 42
    xgboost:
      objective: reg:squarederror
      n_estimators: 160
      learning_rate: 0.03
      max_depth: 3
      reg_alpha: 0.1
      reg_lambda: 0.3
      subsample: 0.85
      colsample_bytree: 0.85
      random_state: 42
    catboost:
      loss_function: RMSE
      allow_const_label: true
      bootstrap_type: "No"
      depth: 4
      learning_rate: 0.04
      iterations: 180
      l2_leaf_reg: 3.0
      verbose: false
      random_seed: 42
    randomforest:
      n_estimators: 400
      max_depth: 6
      min_samples_leaf: 2
      max_features: 0.8
      random_state: 42
    extratrees:
      n_estimators: 480
      max_depth: 6
      min_samples_leaf: 2
      max_features: 0.8
      random_state: 42
    mlp:
      hidden_layer_sizes: [32, 16]
      activation: relu
      alpha: 0.002
      learning_rate_init: 0.0007
      max_iter: 1500
      random_state: 42
    linear_baseline:
      alpha: 1.0
      random_state: 42
training:
  param_candidates:
    lightgbm:
      - name: lgbm_tiny_leaf7_depth2
        objective: regression
        metric: l2
        n_estimators: 80
        learning_rate: 0.04
        num_leaves: 7
        max_depth: 2
        min_child_samples: 16
        reg_alpha: 0.5
        reg_lambda: 0.8
        verbose: -1
        random_state: 42
      - name: lgbm_shallow_leaf10_depth3
        objective: regression
        metric: l2
        n_estimators: 120
        learning_rate: 0.03
        num_leaves: 10
        max_depth: 3
        min_child_samples: 12
        reg_alpha: 0.25
        reg_lambda: 0.5
        verbose: -1
        random_state: 42
      - name: lgbm_balanced_leaf15_depth4
        objective: regression
        metric: l2
        n_estimators: 160
        learning_rate: 0.025
        num_leaves: 15
        max_depth: 4
        min_child_samples: 8
        reg_alpha: 0.1
        reg_lambda: 0.25
        verbose: -1
        random_state: 42
      - name: lgbm_flexible_leaf31_depth5
        objective: regression
        metric: l2
        n_estimators: 220
        learning_rate: 0.018
        num_leaves: 31
        max_depth: 5
        min_child_samples: 6
        reg_alpha: 0.15
        reg_lambda: 0.4
        verbose: -1
        random_state: 42
      - name: lgbm_low_lr_leaf31_depth6
        objective: regression
        metric: l2
        n_estimators: 300
        learning_rate: 0.01
        num_leaves: 31
        max_depth: 6
        min_child_samples: 5
        reg_alpha: 0.2
        reg_lambda: 0.8
        verbose: -1
        random_state: 42
      - name: lgbm_subsampled_depth4
        objective: regression
        metric: l2
        n_estimators: 200
        learning_rate: 0.02
        num_leaves: 15
        max_depth: 4
        min_child_samples: 6
        subsample: 0.8
        subsample_freq: 1
        colsample_bytree: 0.8
        reg_alpha: 0.1
        reg_lambda: 0.3
        verbose: -1
        random_state: 42
    xgboost:
      - name: xgb_depth2_strong_reg
        objective: reg:squarederror
        n_estimators: 120
        learning_rate: 0.04
        max_depth: 2
        min_child_weight: 3
        reg_alpha: 0.5
        reg_lambda: 1.0
        subsample: 0.9
        colsample_bytree: 0.9
        random_state: 42
      - name: xgb_depth3_balanced
        objective: reg:squarederror
        n_estimators: 180
        learning_rate: 0.03
        max_depth: 3
        min_child_weight: 2
        reg_alpha: 0.2
        reg_lambda: 0.6
        subsample: 0.85
        colsample_bytree: 0.85
        random_state: 42
      - name: xgb_depth4_low_lr
        objective: reg:squarederror
        n_estimators: 240
        learning_rate: 0.02
        max_depth: 4
        min_child_weight: 2
        reg_alpha: 0.2
        reg_lambda: 1.0
        subsample: 0.8
        colsample_bytree: 0.8
        random_state: 42
      - name: xgb_depth2_many_trees
        objective: reg:squarederror
        n_estimators: 300
        learning_rate: 0.015
        max_depth: 2
        min_child_weight: 1
        reg_alpha: 0.1
        reg_lambda: 0.5
        subsample: 0.9
        colsample_bytree: 0.9
        random_state: 42
      - name: xgb_depth5_conservative
        objective: reg:squarederror
        n_estimators: 220
        learning_rate: 0.02
        max_depth: 5
        min_child_weight: 4
        reg_alpha: 0.5
        reg_lambda: 1.5
        subsample: 0.75
        colsample_bytree: 0.75
        random_state: 42
    catboost:
      - name: cat_depth2_l2_10
        loss_function: RMSE
        allow_const_label: true
        bootstrap_type: "No"
        depth: 2
        learning_rate: 0.04
        iterations: 160
        l2_leaf_reg: 10.0
        verbose: false
        random_seed: 42
      - name: cat_depth3_l2_6
        loss_function: RMSE
        allow_const_label: true
        bootstrap_type: "No"
        depth: 3
        learning_rate: 0.035
        iterations: 200
        l2_leaf_reg: 6.0
        verbose: false
        random_seed: 42
      - name: cat_depth4_l2_3
        loss_function: RMSE
        allow_const_label: true
        bootstrap_type: "No"
        depth: 4
        learning_rate: 0.03
        iterations: 240
        l2_leaf_reg: 3.0
        verbose: false
        random_seed: 42
      - name: cat_depth5_l2_6
        loss_function: RMSE
        allow_const_label: true
        bootstrap_type: "No"
        depth: 5
        learning_rate: 0.025
        iterations: 260
        l2_leaf_reg: 6.0
        verbose: false
        random_seed: 42
      - name: cat_depth6_l2_12
        loss_function: RMSE
        allow_const_label: true
        bootstrap_type: "No"
        depth: 6
        learning_rate: 0.02
        iterations: 320
        l2_leaf_reg: 12.0
        verbose: false
        random_seed: 42
    randomforest:
      - name: rf_depth3_leaf4
        n_estimators: 500
        max_depth: 3
        min_samples_leaf: 4
        max_features: 0.7
        random_state: 42
      - name: rf_depth4_leaf3
        n_estimators: 500
        max_depth: 4
        min_samples_leaf: 3
        max_features: 0.8
        random_state: 42
      - name: rf_depth6_leaf2
        n_estimators: 500
        max_depth: 6
        min_samples_leaf: 2
        max_features: 0.8
        random_state: 42
      - name: rf_depth8_leaf1
        n_estimators: 600
        max_depth: 8
        min_samples_leaf: 1
        max_features: 0.9
        random_state: 42
      - name: rf_unbounded_leaf2
        n_estimators: 600
        max_depth: null
        min_samples_leaf: 2
        max_features: 0.8
        random_state: 42
    extratrees:
      - name: et_depth3_leaf4
        n_estimators: 600
        max_depth: 3
        min_samples_leaf: 4
        max_features: 0.7
        random_state: 42
      - name: et_depth4_leaf3
        n_estimators: 600
        max_depth: 4
        min_samples_leaf: 3
        max_features: 0.8
        random_state: 42
      - name: et_depth6_leaf2
        n_estimators: 600
        max_depth: 6
        min_samples_leaf: 2
        max_features: 0.8
        random_state: 42
      - name: et_depth8_leaf1
        n_estimators: 800
        max_depth: 8
        min_samples_leaf: 1
        max_features: 0.9
        random_state: 42
      - name: et_unbounded_leaf2
        n_estimators: 800
        max_depth: null
        min_samples_leaf: 2
        max_features: 0.8
        random_state: 42
    mlp:
      - name: mlp_lbfgs_tiny_tanh
        hidden_layer_sizes: [8]
        activation: tanh
        solver: lbfgs
        alpha: 0.01
        max_iter: 1500
        random_state: 42
      - name: mlp_lbfgs_small_relu
        hidden_layer_sizes: [16]
        activation: relu
        solver: lbfgs
        alpha: 0.01
        max_iter: 1500
        random_state: 42
      - name: mlp_adam_small_l2
        hidden_layer_sizes: [16]
        activation: relu
        solver: adam
        alpha: 0.01
        learning_rate_init: 0.0007
        max_iter: 1500
        random_state: 42
      - name: mlp_adam_medium
        hidden_layer_sizes: [32, 16]
        activation: relu
        solver: adam
        alpha: 0.003
        learning_rate_init: 0.0007
        max_iter: 1500
        random_state: 42
      - name: mlp_adam_wide_tanh
        hidden_layer_sizes: [48, 16]
        activation: tanh
        solver: adam
        alpha: 0.005
        learning_rate_init: 0.0005
        max_iter: 1500
        random_state: 42
    linear_baseline:
      - name: ridge_alpha_0_03
        alpha: 0.03
        random_state: 42
      - name: ridge_alpha_0_1
        alpha: 0.1
        random_state: 42
      - name: ridge_alpha_0_3
        alpha: 0.3
        random_state: 42
      - name: ridge_alpha_1
        alpha: 1.0
        random_state: 42
      - name: ridge_alpha_3
        alpha: 3.0
        random_state: 42
      - name: ridge_alpha_10
        alpha: 10.0
        random_state: 42
      - name: ridge_alpha_30
        alpha: 30.0
        random_state: 42
evaluation:
  require_round19_replay: false
  require_round22_static_baseline: false
  round22_static_model_dir: null
