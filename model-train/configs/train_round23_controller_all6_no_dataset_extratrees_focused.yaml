model:
  default_family: extratrees
  feature_version: no_dataset
  include_dataset_one_hot: false
  onehot_order: []
  delta_actions: [-2, -1, 0, 1, 2]
  feature_fields:
    - shape_score
    - private_mean_length
    - private_p75_length
    - private_length_iqr
    - support_mean_at_k20
    - coverage_mean_at_k20
    - coverage_p25_at_k20
    - genericity_mean_at_k20
    - redundancy_mean_at_k20
  family_params:
    extratrees:
      n_estimators: 600
      max_depth: 3
      min_samples_leaf: 4
      max_features: 0.7
      random_state: 42
