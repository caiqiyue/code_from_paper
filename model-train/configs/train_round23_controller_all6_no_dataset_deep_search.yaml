model:
  default_family: extratrees
  feature_version: no_dataset
  include_dataset_one_hot: false
  onehot_order: []
  delta_actions: [-2, -1, 0, 1, 2]
  feature_fields:
    - shape_score
    - private_mean_length
    - private_p75_length
    - private_length_iqr
    - support_mean_at_k20
    - coverage_mean_at_k20
    - coverage_p25_at_k20
    - genericity_mean_at_k20
    - redundancy_mean_at_k20
  family_params:
    extratrees:
      n_estimators: 600
      max_depth: 4
      min_samples_leaf: 3
      max_features: 0.8
      random_state: 42
training:
  param_candidates:
    lightgbm:
      - {name: lgbm_depth1_stump, objective: regression, metric: l2, n_estimators: 120, learning_rate: 0.03, num_leaves: 3, max_depth: 1, min_child_samples: 20, reg_alpha: 0.8, reg_lambda: 1.2, verbose: -1, random_state: 42}
      - {name: lgbm_depth2_regularized, objective: regression, metric: l2, n_estimators: 160, learning_rate: 0.025, num_leaves: 5, max_depth: 2, min_child_samples: 16, reg_alpha: 0.5, reg_lambda: 1.0, verbose: -1, random_state: 42}
      - {name: lgbm_depth3_balanced, objective: regression, metric: l2, n_estimators: 220, learning_rate: 0.018, num_leaves: 10, max_depth: 3, min_child_samples: 12, reg_alpha: 0.25, reg_lambda: 0.5, verbose: -1, random_state: 42}
      - {name: lgbm_depth4_balanced, objective: regression, metric: l2, n_estimators: 260, learning_rate: 0.015, num_leaves: 15, max_depth: 4, min_child_samples: 8, reg_alpha: 0.15, reg_lambda: 0.4, verbose: -1, random_state: 42}
      - {name: lgbm_depth5_low_lr, objective: regression, metric: l2, n_estimators: 360, learning_rate: 0.01, num_leaves: 24, max_depth: 5, min_child_samples: 6, reg_alpha: 0.2, reg_lambda: 0.8, verbose: -1, random_state: 42}
      - {name: lgbm_dart_depth3, objective: regression, metric: l2, boosting_type: dart, n_estimators: 220, learning_rate: 0.018, num_leaves: 10, max_depth: 3, min_child_samples: 10, reg_alpha: 0.2, reg_lambda: 0.6, verbose: -1, random_state: 42}
      - {name: lgbm_subsample_depth3, objective: regression, metric: l2, n_estimators: 260, learning_rate: 0.015, num_leaves: 10, max_depth: 3, min_child_samples: 8, subsample: 0.75, subsample_freq: 1, colsample_bytree: 0.75, reg_alpha: 0.2, reg_lambda: 0.5, verbose: -1, random_state: 42}
    xgboost:
      - {name: xgb_depth1_stump, objective: reg:squarederror, n_estimators: 160, learning_rate: 0.03, max_depth: 1, min_child_weight: 4, reg_alpha: 0.8, reg_lambda: 1.5, subsample: 0.9, colsample_bytree: 0.9, random_state: 42}
      - {name: xgb_depth2_strong_reg, objective: reg:squarederror, n_estimators: 220, learning_rate: 0.02, max_depth: 2, min_child_weight: 3, reg_alpha: 0.5, reg_lambda: 1.2, subsample: 0.85, colsample_bytree: 0.85, random_state: 42}
      - {name: xgb_depth3_balanced, objective: reg:squarederror, n_estimators: 260, learning_rate: 0.018, max_depth: 3, min_child_weight: 2, reg_alpha: 0.25, reg_lambda: 0.8, subsample: 0.8, colsample_bytree: 0.8, random_state: 42}
      - {name: xgb_depth4_low_lr, objective: reg:squarederror, n_estimators: 320, learning_rate: 0.012, max_depth: 4, min_child_weight: 2, reg_alpha: 0.3, reg_lambda: 1.0, subsample: 0.8, colsample_bytree: 0.8, random_state: 42}
      - {name: xgb_depth5_conservative, objective: reg:squarederror, n_estimators: 280, learning_rate: 0.015, max_depth: 5, min_child_weight: 5, reg_alpha: 0.8, reg_lambda: 2.0, subsample: 0.7, colsample_bytree: 0.7, random_state: 42}
    catboost:
      - {name: cat_depth1_l2_20, loss_function: RMSE, allow_const_label: true, bootstrap_type: "No", depth: 1, learning_rate: 0.05, iterations: 140, l2_leaf_reg: 20.0, verbose: false, random_seed: 42}
      - {name: cat_depth2_l2_12, loss_function: RMSE, allow_const_label: true, bootstrap_type: "No", depth: 2, learning_rate: 0.04, iterations: 180, l2_leaf_reg: 12.0, verbose: false, random_seed: 42}
      - {name: cat_depth3_l2_8, loss_function: RMSE, allow_const_label: true, bootstrap_type: "No", depth: 3, learning_rate: 0.035, iterations: 220, l2_leaf_reg: 8.0, verbose: false, random_seed: 42}
      - {name: cat_depth4_l2_4, loss_function: RMSE, allow_const_label: true, bootstrap_type: "No", depth: 4, learning_rate: 0.03, iterations: 260, l2_leaf_reg: 4.0, verbose: false, random_seed: 42}
      - {name: cat_depth5_l2_8, loss_function: RMSE, allow_const_label: true, bootstrap_type: "No", depth: 5, learning_rate: 0.022, iterations: 320, l2_leaf_reg: 8.0, verbose: false, random_seed: 42}
      - {name: cat_depth6_l2_16, loss_function: RMSE, allow_const_label: true, bootstrap_type: "No", depth: 6, learning_rate: 0.018, iterations: 360, l2_leaf_reg: 16.0, verbose: false, random_seed: 42}
    randomforest:
      - {name: rf_depth2_leaf5_feat06, n_estimators: 700, max_depth: 2, min_samples_leaf: 5, max_features: 0.6, random_state: 42}
      - {name: rf_depth3_leaf4_feat07, n_estimators: 700, max_depth: 3, min_samples_leaf: 4, max_features: 0.7, random_state: 42}
      - {name: rf_depth4_leaf3_feat08, n_estimators: 700, max_depth: 4, min_samples_leaf: 3, max_features: 0.8, random_state: 42}
      - {name: rf_depth5_leaf3_feat09, n_estimators: 800, max_depth: 5, min_samples_leaf: 3, max_features: 0.9, random_state: 42}
      - {name: rf_depth6_leaf2_feat08, n_estimators: 800, max_depth: 6, min_samples_leaf: 2, max_features: 0.8, random_state: 42}
      - {name: rf_depth8_leaf2_feat08, n_estimators: 900, max_depth: 8, min_samples_leaf: 2, max_features: 0.8, random_state: 42}
      - {name: rf_unbounded_leaf2_feat08, n_estimators: 900, max_depth: null, min_samples_leaf: 2, max_features: 0.8, random_state: 42}
    extratrees:
      - {name: et_depth2_leaf5_feat06, n_estimators: 800, max_depth: 2, min_samples_leaf: 5, max_features: 0.6, random_state: 42}
      - {name: et_depth3_leaf4_feat07, n_estimators: 800, max_depth: 3, min_samples_leaf: 4, max_features: 0.7, random_state: 42}
      - {name: et_depth3_leaf3_feat08, n_estimators: 800, max_depth: 3, min_samples_leaf: 3, max_features: 0.8, random_state: 42}
      - {name: et_depth4_leaf3_feat08, n_estimators: 800, max_depth: 4, min_samples_leaf: 3, max_features: 0.8, random_state: 42}
      - {name: et_depth4_leaf2_feat09, n_estimators: 900, max_depth: 4, min_samples_leaf: 2, max_features: 0.9, random_state: 42}
      - {name: et_depth5_leaf2_feat08, n_estimators: 900, max_depth: 5, min_samples_leaf: 2, max_features: 0.8, random_state: 42}
      - {name: et_depth6_leaf1_feat08, n_estimators: 1000, max_depth: 6, min_samples_leaf: 1, max_features: 0.8, random_state: 42}
      - {name: et_unbounded_leaf2_feat07, n_estimators: 1000, max_depth: null, min_samples_leaf: 2, max_features: 0.7, random_state: 42}
    gradientboosting:
      - {name: gbr_depth1_lr003, n_estimators: 160, learning_rate: 0.03, max_depth: 1, min_samples_leaf: 8, subsample: 0.9, random_state: 42}
      - {name: gbr_depth2_lr002, n_estimators: 240, learning_rate: 0.02, max_depth: 2, min_samples_leaf: 6, subsample: 0.9, random_state: 42}
      - {name: gbr_depth2_lr001, n_estimators: 360, learning_rate: 0.01, max_depth: 2, min_samples_leaf: 5, subsample: 0.8, random_state: 42}
      - {name: gbr_depth3_lr0015, n_estimators: 260, learning_rate: 0.015, max_depth: 3, min_samples_leaf: 5, subsample: 0.8, random_state: 42}
      - {name: gbr_huber_depth2, loss: huber, alpha: 0.85, n_estimators: 260, learning_rate: 0.015, max_depth: 2, min_samples_leaf: 5, subsample: 0.85, random_state: 42}
    histgradientboosting:
      - {name: hgb_depth2_l2_1, max_iter: 160, learning_rate: 0.03, max_depth: 2, max_leaf_nodes: 7, min_samples_leaf: 12, l2_regularization: 1.0, random_state: 42}
      - {name: hgb_depth3_l2_05, max_iter: 220, learning_rate: 0.02, max_depth: 3, max_leaf_nodes: 15, min_samples_leaf: 10, l2_regularization: 0.5, random_state: 42}
      - {name: hgb_depth4_l2_1, max_iter: 260, learning_rate: 0.015, max_depth: 4, max_leaf_nodes: 31, min_samples_leaf: 8, l2_regularization: 1.0, random_state: 42}
      - {name: hgb_leaf7_l2_2, max_iter: 240, learning_rate: 0.018, max_depth: null, max_leaf_nodes: 7, min_samples_leaf: 12, l2_regularization: 2.0, random_state: 42}
    adaboost:
      - {name: ada_60_lr003_linear, n_estimators: 60, learning_rate: 0.03, loss: linear, random_state: 42}
      - {name: ada_100_lr002_linear, n_estimators: 100, learning_rate: 0.02, loss: linear, random_state: 42}
      - {name: ada_120_lr001_square, n_estimators: 120, learning_rate: 0.01, loss: square, random_state: 42}
      - {name: ada_80_lr002_exponential, n_estimators: 80, learning_rate: 0.02, loss: exponential, random_state: 42}
    svr:
      - {name: svr_rbf_c01_eps001, kernel: rbf, C: 0.1, epsilon: 0.001, gamma: scale}
      - {name: svr_rbf_c03_eps001, kernel: rbf, C: 0.3, epsilon: 0.001, gamma: scale}
      - {name: svr_rbf_c1_eps001, kernel: rbf, C: 1.0, epsilon: 0.001, gamma: scale}
      - {name: svr_rbf_c1_eps0005, kernel: rbf, C: 1.0, epsilon: 0.0005, gamma: scale}
      - {name: svr_linear_c03, kernel: linear, C: 0.3, epsilon: 0.001}
      - {name: svr_linear_c1, kernel: linear, C: 1.0, epsilon: 0.001}
    knn:
      - {name: knn_3_distance_p2, n_neighbors: 3, weights: distance, p: 2}
      - {name: knn_5_distance_p2, n_neighbors: 5, weights: distance, p: 2}
      - {name: knn_7_distance_p2, n_neighbors: 7, weights: distance, p: 2}
      - {name: knn_9_distance_p1, n_neighbors: 9, weights: distance, p: 1}
      - {name: knn_11_uniform_p2, n_neighbors: 11, weights: uniform, p: 2}
    elasticnet:
      - {name: enet_a0001_l1_01, alpha: 0.0001, l1_ratio: 0.1, max_iter: 5000, random_state: 42}
      - {name: enet_a0003_l1_01, alpha: 0.0003, l1_ratio: 0.1, max_iter: 5000, random_state: 42}
      - {name: enet_a001_l1_02, alpha: 0.001, l1_ratio: 0.2, max_iter: 5000, random_state: 42}
      - {name: enet_a003_l1_05, alpha: 0.003, l1_ratio: 0.5, max_iter: 5000, random_state: 42}
      - {name: enet_a01_l1_05, alpha: 0.01, l1_ratio: 0.5, max_iter: 5000, random_state: 42}
    mlp:
      - {name: mlp_lbfgs_tiny_tanh, hidden_layer_sizes: [8], activation: tanh, solver: lbfgs, alpha: 0.01, max_iter: 2000, random_state: 42}
      - {name: mlp_lbfgs_small_relu, hidden_layer_sizes: [16], activation: relu, solver: lbfgs, alpha: 0.01, max_iter: 2000, random_state: 42}
      - {name: mlp_lbfgs_medium_tanh, hidden_layer_sizes: [16, 8], activation: tanh, solver: lbfgs, alpha: 0.02, max_iter: 2000, random_state: 42}
      - {name: mlp_adam_small_l2, hidden_layer_sizes: [16], activation: relu, solver: adam, alpha: 0.01, learning_rate_init: 0.0007, max_iter: 2000, random_state: 42}
      - {name: mlp_adam_medium_l2, hidden_layer_sizes: [32, 16], activation: relu, solver: adam, alpha: 0.005, learning_rate_init: 0.0005, max_iter: 2000, random_state: 42}
    linear_baseline:
      - {name: ridge_alpha_0_01, alpha: 0.01, random_state: 42}
      - {name: ridge_alpha_0_03, alpha: 0.03, random_state: 42}
      - {name: ridge_alpha_0_1, alpha: 0.1, random_state: 42}
      - {name: ridge_alpha_0_3, alpha: 0.3, random_state: 42}
      - {name: ridge_alpha_1, alpha: 1.0, random_state: 42}
      - {name: ridge_alpha_3, alpha: 3.0, random_state: 42}
      - {name: ridge_alpha_10, alpha: 10.0, random_state: 42}
evaluation:
  require_round19_replay: false
  require_round22_static_baseline: false
  round22_static_model_dir: null
