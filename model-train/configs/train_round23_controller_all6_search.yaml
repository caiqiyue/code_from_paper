model:
  default_family: lightgbm
  feature_version: no_dataset
  include_dataset_one_hot: false
  onehot_order: [jobs, congressional, forums, microblog, imdb, openreview]
  delta_actions: [-2, -1, 0, 1, 2]
  feature_fields:
    - shape_score
    - private_mean_length
    - private_p75_length
    - private_length_iqr
    - support_mean_at_k20
    - coverage_mean_at_k20
    - coverage_p25_at_k20
    - genericity_mean_at_k20
    - redundancy_mean_at_k20
  family_params:
    lightgbm:
      objective: regression
      metric: l2
      n_estimators: 100
      learning_rate: 0.03
      num_leaves: 15
      max_depth: 4
      min_child_samples: 8
      reg_alpha: 0.1
      reg_lambda: 0.1
      verbose: -1
      random_state: 42
    xgboost:
      n_estimators: 120
      learning_rate: 0.04
      max_depth: 3
      reg_alpha: 0.1
      reg_lambda: 0.1
      subsample: 0.9
      colsample_bytree: 0.9
      random_state: 42
    catboost:
      loss_function: RMSE
      allow_const_label: true
      bootstrap_type: "No"
      depth: 4
      learning_rate: 0.04
      iterations: 160
      verbose: false
      random_seed: 42
    randomforest:
      n_estimators: 300
      max_depth: 6
      min_samples_leaf: 2
      random_state: 42
    extratrees:
      n_estimators: 360
      max_depth: 6
      min_samples_leaf: 2
      random_state: 42
    mlp:
      hidden_layer_sizes: [32, 16]
      activation: relu
      alpha: 0.001
      learning_rate_init: 0.001
      max_iter: 1000
      random_state: 42
    linear_baseline:
      alpha: 1.0
      random_state: 42
training:
  param_candidates:
    lightgbm:
      - name: lgbm_shallow_regularized
        n_estimators: 80
        learning_rate: 0.03
        num_leaves: 10
        max_depth: 3
        min_child_samples: 12
        reg_alpha: 0.2
        reg_lambda: 0.3
        verbose: -1
        random_state: 42
      - name: lgbm_medium
        n_estimators: 120
        learning_rate: 0.03
        num_leaves: 15
        max_depth: 4
        min_child_samples: 8
        reg_alpha: 0.1
        reg_lambda: 0.1
        verbose: -1
        random_state: 42
      - name: lgbm_deeper_conservative
        n_estimators: 160
        learning_rate: 0.02
        num_leaves: 24
        max_depth: 5
        min_child_samples: 10
        reg_alpha: 0.2
        reg_lambda: 0.4
        verbose: -1
        random_state: 42
      - name: lgbm_leaf_heavy
        n_estimators: 140
        learning_rate: 0.025
        num_leaves: 31
        max_depth: 6
        min_child_samples: 6
        reg_alpha: 0.05
        reg_lambda: 0.2
        verbose: -1
        random_state: 42
    xgboost:
      - name: xgb_shallow_regularized
        n_estimators: 100
        learning_rate: 0.04
        max_depth: 2
        reg_alpha: 0.2
        reg_lambda: 0.4
        subsample: 0.9
        colsample_bytree: 0.9
        random_state: 42
      - name: xgb_medium
        n_estimators: 140
        learning_rate: 0.04
        max_depth: 3
        reg_alpha: 0.1
        reg_lambda: 0.2
        subsample: 0.85
        colsample_bytree: 0.85
        random_state: 42
      - name: xgb_deeper_regularized
        n_estimators: 180
        learning_rate: 0.025
        max_depth: 4
        reg_alpha: 0.2
        reg_lambda: 0.6
        subsample: 0.8
        colsample_bytree: 0.8
        random_state: 42
    catboost:
      - name: catboost_shallow
        loss_function: RMSE
        allow_const_label: true
        bootstrap_type: "No"
        depth: 3
        learning_rate: 0.03
        iterations: 180
        verbose: false
        random_seed: 42
      - name: catboost_medium
        loss_function: RMSE
        allow_const_label: true
        bootstrap_type: "No"
        depth: 4
        learning_rate: 0.04
        iterations: 160
        verbose: false
        random_seed: 42
      - name: catboost_deeper
        loss_function: RMSE
        allow_const_label: true
        bootstrap_type: "No"
        depth: 5
        learning_rate: 0.025
        iterations: 220
        verbose: false
        random_seed: 42
    randomforest:
      - name: rf_shallow_stable
        n_estimators: 300
        max_depth: 4
        min_samples_leaf: 3
        random_state: 42
      - name: rf_medium
        n_estimators: 300
        max_depth: 6
        min_samples_leaf: 2
        random_state: 42
      - name: rf_deeper
        n_estimators: 400
        max_depth: 8
        min_samples_leaf: 1
        random_state: 42
    extratrees:
      - name: et_shallow_stable
        n_estimators: 360
        max_depth: 4
        min_samples_leaf: 3
        random_state: 42
      - name: et_medium
        n_estimators: 360
        max_depth: 6
        min_samples_leaf: 2
        random_state: 42
      - name: et_deeper
        n_estimators: 480
        max_depth: 8
        min_samples_leaf: 1
        random_state: 42
    mlp:
      - name: mlp_small_l2
        hidden_layer_sizes: [16]
        activation: relu
        alpha: 0.005
        learning_rate_init: 0.001
        max_iter: 1000
        random_state: 42
      - name: mlp_medium
        hidden_layer_sizes: [32, 16]
        activation: relu
        alpha: 0.001
        learning_rate_init: 0.001
        max_iter: 1000
        random_state: 42
      - name: mlp_tanh
        hidden_layer_sizes: [32]
        activation: tanh
        alpha: 0.002
        learning_rate_init: 0.001
        max_iter: 1000
        random_state: 42
    linear_baseline:
      - name: ridge_weak
        alpha: 0.3
        random_state: 42
      - name: ridge_default
        alpha: 1.0
        random_state: 42
      - name: ridge_strong
        alpha: 3.0
        random_state: 42
      - name: ridge_very_strong
        alpha: 10.0
        random_state: 42
evaluation:
  require_round19_replay: false
  require_round22_static_baseline: false
  round22_static_model_dir: null
