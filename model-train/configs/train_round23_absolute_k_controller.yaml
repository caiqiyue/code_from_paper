model:
  absolute_budgets: [18, 19, 20, 21, 22]
  feature_version: no_dataset
  feature_fields:
    - shape_score
    - private_mean_length
    - private_p75_length
    - private_length_iqr
    - support_mean_at_k20
    - coverage_mean_at_k20
    - coverage_p25_at_k20
    - genericity_mean_at_k20
    - redundancy_mean_at_k20
  include_dataset_one_hot: false
  family_params:
    extratrees:
      n_estimators: 400
      max_depth: 8
      min_samples_leaf: 4
      random_state: 42
      n_jobs: -1
training:
  param_candidates:
    extratrees:
      - name: focused_default
        n_estimators: 400
        max_depth: 8
        min_samples_leaf: 4
        random_state: 42
        n_jobs: -1
