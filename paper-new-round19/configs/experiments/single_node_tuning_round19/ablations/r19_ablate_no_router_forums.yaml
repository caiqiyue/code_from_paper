inherits:
  - ../_base_selector_tuning_round19.yaml
  - ../_data_forums.yaml

meta:
  experiment_id: r19_ablate_no_router_forums

paths:
  output_root: paper-new-round19/outputs/r19_ablate_no_router_forums

selector:
  seed_budget_rule:
    enabled: true
    mode: self_calibrated_constrained
    candidate_seed_top_k: [18, 19, 20, 21, 22]
    coverage_constraint:
      mode: tail_family_relative
      metrics:
        - name: coverage_p25
          relative_ratio: 0.98
          required: true
          weight: 0.7
        - name: coverage_mean
          relative_ratio: 0.998
          required: true
          weight: 0.3
        - name: coverage_min
          relative_ratio: 0.995
          required: false
          weight: 0.0
    utility:
      support_weight: 1.0
      genericity_weight: 0.5
      redundancy_weight: 0.3
      budget_weight: 0.1
    tiebreak:
      epsilon: 0.01
      prefer_smaller_budget: true
    constrained_recheck:
      enabled: false

