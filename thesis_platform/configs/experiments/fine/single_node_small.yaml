# Small-scale test configuration for single-node fine version
# Used to verify component integration before full-scale run

inherits:
  - ../../base/paths.yaml
  - ../../base/runtime.yaml
  - ../../base/llm_qwen_windows.yaml
  - ../../methods/generators/pretext_prompt_llm.yaml
  - ../../methods/scorers/datainf_real.yaml
  - ../../methods/retrievers/knn.yaml
  - ../../methods/critics/fedtextgrad_llm.yaml
  - ../../methods/aggregators/dbscan_attn_tsgdm.yaml

# Override repo_root to point to caiqiyue_file (parent of thesis_platform/)
paths:
  repo_root: ../../../..

# Override aggregator embedding_model (repo_root now points to caiqiyue_file)
aggregator:
  embedding_model: thesis_platform/open_model/all_minilm_l6_v2
  allow_hashing_fallback: false

meta:
  experiment_id: single_node_small
  stage: fine
  seed: 42

# Data configuration (single node, no client partition)
data:
  dataset_name: congressional
  task_type: instruction_tuning
  sample_format: raw_text
  train_path: thesis_platform/datasets/congressional/formatted/congressional_train.json
  max_samples_per_client: 10000
  initialization_min_words: 20
  initialization_path: thesis_platform/datasets/pretext_initialization_c4_en/formatted/initialization.json

# Stage A: Large-scale generation and scoring (small scale)
stage_a:
  enabled: true
  scorer: datainf_real
  generated_count: 1000
  batch_size: 200
  select_top_k: 800
  max_probe_samples: 500
  failure_equal_epsilon: 1e-9
  failure_margin_threshold: 0.05
  random_fallback_seed: 42

# Stage B: Critique-retrieval-aggregation loop (small scale)
stage_b:
  enabled: true
  num_iterations: 2
  batch_size: 100
  selection_mode: worst

# Stage C: Bootstrap expansion (small scale)
stage_c:
  enabled: true
  num_prompts: 1000
  generator_backend: local
  generator_model: thesis_platform/open_model/distilgpt2
  max_tokens: 64
  temperature: 1.0
  top_p: 1.0

# Privacy (disabled by default for single node)
privacy:
  enabled: false

# Downstream evaluation via PrE-Text (pretext_platform is at ../PrE-Text/pretext_platform)
downstream_eval:
  enabled: true
  kind: pretext_small_eval
  export_filename: llama7b_text_syn.json
  run_large_eval: false
  run_small_eval: true
  small_eval_mode: gpt2
  dataset_root: thesis_platform/datasets
  model_root: thesis_platform/open_model
  distilgpt2_path: thesis_platform/open_model/distilgpt2
  minilm_path: thesis_platform/open_model/all_minilm_l6_v2
  roberta_large_path: thesis_platform/open_model/roberta_large
  llama2_7b_path: thesis_platform/open_model/llama_2_7b_hf
  cutoff_len: 48
  small_cutoff_len: 48
  small_epochs: 1
  small_batch_size: 8
  small_eval_batch_size: 8
  small_learning_rate: 0.0002
  small_num_proc: 1
  small_grad_accum_steps: 1
