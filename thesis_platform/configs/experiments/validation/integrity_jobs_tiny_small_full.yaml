inherits:
  - ../../base/paths.yaml
  - ../../base/runtime.yaml
  - ../../methods/generators/pretext_prompt_llm.yaml
  - ../../methods/scorers/datainf_real.yaml
  - ../../methods/retrievers/knn.yaml
  - ../../methods/critics/fedtextgrad_llm.yaml
  - ../../methods/aggregators/dbscan_attn_tsgdm.yaml
  - ../../methods/prototypes/minilm_mean.yaml
  - ../../methods/routing/personalized_v3.yaml
  - ../../methods/privacy/jobs_eps129.yaml

meta:
  experiment_id: integrity_jobs_tiny_small_full
  stage: integrity_test
  seed: 42

data:
  dataset_name: jobs
  task_type: instruction_tuning
  sample_format: raw_text
  partition_strategy: preserve_buckets
  train_path: thesis_platform/datasets/pretext_jobs/formatted/jobs_train.json
  eval_path: thesis_platform/datasets/pretext_jobs/formatted/jobs_eval.json
  public_seed_path: thesis_platform/datasets/pretext_initialization_c4_en/formatted/initialization.json
  initialization_path: thesis_platform/datasets/pretext_initialization_c4_en/formatted/initialization.json
  max_public_seed_samples: 4
  num_clients: 2
  max_samples_per_client: 2
  validation_ratio: 0.5
  train_limit: 4
  eval_limit: 4

llm:
  client:
    engine: transformers
    model_name_or_path: thesis_platform/open_model/distilgpt2
    device: auto
    dtype: auto
    temperature: 0.0
    max_new_tokens: 24
    use_chat_template: false
  server:
    engine: transformers
    model_name_or_path: thesis_platform/open_model/distilgpt2
    device: auto
    dtype: auto
    temperature: 0.0
    max_new_tokens: 24
    use_chat_template: false

generator:
  name: pretext_prompt_llm
  generated_per_round: 2
  exemplars_per_prompt: 1
  max_new_tokens: 24
  temperature: 0.0
  initial_prompt: "Generate concise job-related text."

critic:
  name: fedtextgrad_llm
  compress_to_n_rules: 2
  redact_enable: true

scorer:
  name: datainf_real
  feature_model: thesis_platform/open_model/all_minilm_l6_v2
  allow_hashing_fallback: true
  max_length: 128
  device: auto

retriever:
  name: knn
  embedding_model: thesis_platform/open_model/all_minilm_l6_v2
  allow_hashing_fallback: true
  top_k: 1

prototype:
  name: minilm_mean
  embedding_model: thesis_platform/open_model/all_minilm_l6_v2
  allow_hashing_fallback: true

aggregator:
  name: dbscan_attn_tsgdm
  max_rules: 3
  embedding_model: thesis_platform/open_model/all_minilm_l6_v2
  allow_hashing_fallback: true
  cluster_eps: 0.4
  cluster_min_samples: 1
  momentum_beta: 0.6

routing:
  enabled: true
  personalized_mix_ratio: 0.5
  cluster_eps: 0.4
  cluster_min_samples: 1

federation:
  rounds: 1
  top_k_bad: 1

downstream_eval:
  run_small_eval: true
  small_eval_mode: gpt2
  windows_small_eval_mode: gpt2
  linux_small_eval_mode: gpt2
  run_large_eval: false
  large_eval_mode: none
  cutoff_len: 32
  grad_accum_steps: 4
  epochs: 1
  batch_size: 4
  eval_batch_size: 4
  num_proc: 1
  distilgpt2_path: thesis_platform/open_model/distilgpt2
