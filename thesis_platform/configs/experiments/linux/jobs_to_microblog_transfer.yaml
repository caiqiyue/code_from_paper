inherits:
  - ./jobs_real_datainf_v3_linux.yaml

meta:
  experiment_id: jobs_to_microblog_transfer
  description: "Cross-domain transfer from jobs to microblog."

cross_domain_eval:
  enabled: true
  run_large_eval: false
  run_small_eval: true
  small_eval_mode: gpt2
  linux_small_eval_mode: gpt2
  target_dataset: microblog
  target_train_path: thesis_platform/datasets/pretext_microblog/formatted/microblog_train.json
  target_eval_path: thesis_platform/datasets/pretext_microblog/formatted/microblog_eval.json
