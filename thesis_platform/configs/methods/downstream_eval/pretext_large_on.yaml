downstream_eval:
  enabled: true
  kind: pretext_large_eval
  export_filename: llama7b_text_syn.json
  run_small_eval: true
  run_large_eval: false
  # Safe defaults for the fixed RTX 2080 Ti (22GB) server.
  small_cutoff_len: 64
  small_grad_accum_steps: 8
  small_epochs: 20
  small_batch_size: 8
  small_eval_batch_size: 2
  small_learning_rate: 0.0002
  small_num_proc: 1
