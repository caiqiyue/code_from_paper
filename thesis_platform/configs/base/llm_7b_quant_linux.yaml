# LLM config for RTX 2080 Ti (22GB) - 7B models with 4-bit quantization
# Use this when you need more model capacity than 3B provides
llm:
  client:
    engine: transformers
    model_name_or_path: thesis_platform/open_model/llama_2_7b_hf
    device: auto
    dtype: auto
    temperature: 0.0
    max_new_tokens: 196
    use_chat_template: false
    use_fast: false
    load_in_4bit: true
  server:
    engine: transformers
    model_name_or_path: thesis_platform/open_model/llama_2_7b_hf
    device: auto
    dtype: auto
    temperature: 0.2
    max_new_tokens: 220
    use_chat_template: false
    use_fast: false
    load_in_4bit: true
