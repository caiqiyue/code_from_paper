# LLM config for RTX A6000 (49GB) - 7B models loaded on demand per stage
# Note: device is set to cuda while launch scripts hide GPU 0 with CUDA_VISIBLE_DEVICES=1.
llm:
  client:
    engine: transformers
    model_name_or_path: thesis_platform/open_model/llama_2_7b_hf
    device: cuda
    dtype: auto
    temperature: 0.0
    max_new_tokens: 196
    use_chat_template: false
    use_fast: false
  server:
    engine: transformers
    model_name_or_path: thesis_platform/open_model/llama_2_7b_hf
    device: cuda
    dtype: auto
    temperature: 0.2
    max_new_tokens: 220
    use_chat_template: false
    use_fast: false
