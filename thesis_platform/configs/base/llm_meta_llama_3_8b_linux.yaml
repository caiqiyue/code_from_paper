# GC5 and GM3 now use the verified Meta-Llama-3-8B checkpoint with on-demand loading.
llm:
  client:
    engine: transformers
    model_name_or_path: thesis_platform/open_model/Meta-Llama-3-8B
    device: cuda
    dtype: auto
    temperature: 0.0
    max_new_tokens: 196
    use_chat_template: false
    use_fast: false
  server:
    engine: transformers
    model_name_or_path: thesis_platform/open_model/Meta-Llama-3-8B
    device: cuda
    dtype: auto
    temperature: 0.2
    max_new_tokens: 220
    use_chat_template: false
    use_fast: false
