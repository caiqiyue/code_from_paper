# Legacy 3B config name retained for compatibility.
# Formal Linux experiments use qwen_2_0_5b_instruct because the 3B weights are not a stable server resource.
llm:
  client:
    engine: transformers
    model_name_or_path: thesis_platform/open_model/qwen_2_0_5b_instruct
    device: cuda:1
    dtype: auto
    temperature: 0.0
    max_new_tokens: 196
    use_chat_template: true
    use_fast: false
  server:
    engine: transformers
    model_name_or_path: thesis_platform/open_model/qwen_2_0_5b_instruct
    device: cuda:1
    dtype: auto
    temperature: 0.2
    max_new_tokens: 220
    use_chat_template: true
    use_fast: false
