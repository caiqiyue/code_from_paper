selector:
  seed_budget_rule:
    coverage_constraint:
      metrics:
        - name: coverage_p25
          relative_ratio: 0.98
          required: true
          weight: 0.75
        - name: coverage_mean
          relative_ratio: 0.9985
          required: true
          weight: 0.25
        - name: coverage_min
          relative_ratio: 0.995
          required: false
          weight: 0.0
    constrained_recheck:
      enabled: true
      candidate_mode: adjacent_only
      support_drop_ratio_max: 0.012
      coverage_mean_gain_min: 0.00010
      coverage_p25_gain_min: 0.0
      coverage_min_gain_min: 0.0
      family_score_gain_min: 0.015
