inherits:
  - ../single_node_tuning_round17/_base_selector_tuning_round17.yaml

meta:
  stage: single_node_tuning_round18
  seed: 42

selector:
  seed_budget_rule:
    enabled: true
    mode: self_calibrated_constrained
    candidate_seed_top_k: [18, 19, 20, 21, 22]
    coverage_constraint:
      mode: tail_family_relative
      metrics:
        - name: coverage_p25
          relative_ratio: 0.98
          required: true
          weight: 0.7
        - name: coverage_mean
          relative_ratio: 0.998
          required: true
          weight: 0.3
        - name: coverage_min
          relative_ratio: 0.995
          required: false
          weight: 0.0
    constrained_recheck:
      enabled: false
      support_drop_max: 0.02
      coverage_mean_gain_min: 0.00005
      coverage_p25_gain_min: 0.0
      coverage_min_gain_min: 0.0
