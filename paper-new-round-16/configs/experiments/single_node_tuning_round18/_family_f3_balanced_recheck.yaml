selector:
  seed_budget_rule:
    coverage_constraint:
      metrics:
        - name: coverage_p25
          relative_ratio: 0.98
          required: true
          weight: 0.7
        - name: coverage_mean
          relative_ratio: 0.9985
          required: true
          weight: 0.3
        - name: coverage_min
          relative_ratio: 0.995
          required: false
          weight: 0.0
    constrained_recheck:
      enabled: true
      support_drop_max: 0.015
      coverage_mean_gain_min: 0.00010
      coverage_p25_gain_min: 0.0
      coverage_min_gain_min: 0.0
